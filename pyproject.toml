[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delft3d-fm-cli"
dynamic = ["version"]
description = "AI-friendly inspection, preserved edits and bounded serial Delft3D FM runs"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
run = ["netCDF4==1.7.5.1.post1"]

[project.scripts]
dfm = "dfm_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "dfm_cli.__version__"}
